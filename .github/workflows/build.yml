name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.110"
  PROJECT_PATH: "src/AgentShell.Daemon/AgentShell.Daemon.csproj"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Protocol
        uses: actions/checkout@v4
        with:
          repository: jyh-agentshell/agentshell-protocol
          path: agentshell-protocol

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/AgentShell.Daemon.Tests/AgentShell.Daemon.Tests.csproj --configuration Release --no-restore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - runtime: linux-x64
            suffix: linux-x64
          - runtime: linux-arm64
            suffix: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Protocol
        uses: actions/checkout@v4
        with:
          repository: jyh-agentshell/agentshell-protocol
          path: agentshell-protocol

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish (${{ matrix.runtime }})
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=true
          --output ./publish/${{ matrix.runtime }}

      - name: Smoke Test (${{ matrix.runtime }})
        run: |
          mv ./publish/${{ matrix.runtime }}/agentshell-daemon ./publish/${{ matrix.runtime }}/agentshell-daemon-${{ matrix.suffix }}
          chmod +x ./publish/${{ matrix.runtime }}/agentshell-daemon-${{ matrix.suffix }}
          ./publish/${{ matrix.runtime }}/agentshell-daemon-${{ matrix.suffix }} --version

      - name: Generate SHA256
        run: |
          cd ./publish/${{ matrix.runtime }}
          sha256sum agentshell-daemon-${{ matrix.suffix }} > agentshell-daemon-${{ matrix.suffix }}.sha256

      - name: Upload to Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: |
            ./publish/${{ matrix.runtime }}/agentshell-daemon-${{ matrix.suffix }}
            ./publish/${{ matrix.runtime }}/agentshell-daemon-${{ matrix.suffix }}.sha256
