name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.110"
  PROJECT_PATH: "agentshell-daemon/src/AgentShell.Daemon/AgentShell.Daemon.csproj"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: agentshell-daemon

      - name: Checkout Protocol
        uses: actions/checkout@v4
        with:
          repository: jyh-agentshell/agentshell-protocol
          # 与 daemon 的 0.3.1 兼容窗口一起评审；不得随默认分支漂移。
          ref: b0050f05edbd0d16399e09bbdd1ae18884200470
          path: agentshell-protocol

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Test
        run: dotnet test agentshell-daemon/tests/AgentShell.Daemon.Tests/AgentShell.Daemon.Tests.csproj --configuration Release --no-restore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - runtime: linux-x64
            suffix: linux-x64
          - runtime: linux-arm64
            suffix: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: agentshell-daemon

      - name: Checkout Protocol
        uses: actions/checkout@v4
        with:
          repository: jyh-agentshell/agentshell-protocol
          # 发布产物必须使用与 build job 相同的已验证契约。
          ref: b0050f05edbd0d16399e09bbdd1ae18884200470
          path: agentshell-protocol

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish (${{ matrix.runtime }})
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=true
          --output ./publish/${{ matrix.runtime }}

      - name: Smoke Test (${{ matrix.runtime }})
        run: |
          mv ./publish/${{ matrix.runtime }}/agentshell-daemon ./publish/${{ matrix.runtime }}/agentshell-daemon-${{ matrix.suffix }}
          chmod +x ./publish/${{ matrix.runtime }}/agentshell-daemon-${{ matrix.suffix }}
          binary=./publish/${{ matrix.runtime }}/agentshell-daemon-${{ matrix.suffix }}
          if [ "${{ matrix.runtime }}" = "linux-x64" ]; then
            "$binary" --version
            smoke_home="${{ runner.temp }}/agentshell-daemon-smoke"
            mkdir -p "$smoke_home/.agentshell"
            HOME="$smoke_home" "$binary" --generate-config > "$smoke_home/.agentshell/agentshell.toml"
            binding_code=$(HOME="$smoke_home" "$binary" --generate-binding-code)
            proof=$(printf '%s:%s' "$binding_code" ci-nonce | HOME="$smoke_home" "$binary" bind-verify)
            test ! -e "$smoke_home/.agentshell/binding-code.state"
            printf '%s' "$proof" | grep -q '"host_id"'
            printf '%s' "$proof" | grep -q '"signature"'
            printf '%s' "$proof" | grep -q '"public_key"'
          else
            file "$binary" | grep -q 'ARM aarch64'
          fi

      - name: Generate SHA256
        run: |
          cd ./publish/${{ matrix.runtime }}
          sha256sum agentshell-daemon-${{ matrix.suffix }} > agentshell-daemon-${{ matrix.suffix }}.sha256

      - name: Upload to Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: |
            ./publish/${{ matrix.runtime }}/agentshell-daemon-${{ matrix.suffix }}
            ./publish/${{ matrix.runtime }}/agentshell-daemon-${{ matrix.suffix }}.sha256
